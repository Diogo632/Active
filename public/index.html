<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Base de Conhecimento · Active Corp</title>
    <meta name="description" content="Base de conhecimento do Suporte da Active Corp com o assistente Active IA" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      // Aplica o tema salvo antes da renderização, evitando "piscar" o tema errado.
      try {
        const t = localStorage.getItem('kb-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span class="brand-text">
            <strong>Active Corp</strong>
            <small>Base de Conhecimento · Suporte</small>
          </span>
        </a>

        <nav class="nav">
          <a href="#/" data-nav="home"><i data-icon="home"></i>Início</a>
          <a href="#/docs" data-nav="docs"><i data-icon="library"></i>Todos os documentos</a>
          <a href="#/ia" data-nav="ia" class="nav-ia"><i data-icon="sparkles"></i>Active IA</a>
        </nav>

        <div class="nav-actions">
          <a class="btn btn-primary btn-block" href="#/new"><i data-icon="pen"></i>Escrever texto</a>
          <a class="btn btn-ghost-inverse btn-block" href="#/upload"><i data-icon="upload"></i>Enviar arquivos</a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">
            <span>Categorias</span>
            <a href="#/categories" title="Gerenciar categorias" class="icon-link"><i data-icon="settings"></i></a>
          </div>
          <div id="nav-categories" class="nav-categories"></div>
        </div>

        <div class="sidebar-footer">
          <button class="theme-toggle" id="theme-toggle" type="button" title="Alternar tema claro/escuro">
            <i data-icon="moon"></i><span>Tema</span>
          </button>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Abrir menu"><i data-icon="menu"></i></button>
          <button class="topbar-search" id="topbar-search" type="button" aria-label="Buscar na base (Ctrl+K)">
            <i data-icon="search"></i>
            <span>Buscar na base…</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button class="btn btn-ia" id="open-ia" type="button"><i data-icon="sparkles"></i><span>Perguntar ao Active IA</span></button>
        </header>

        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>

    <!-- Painel lateral do Active IA, disponível em qualquer página -->
    <aside class="ia-drawer" id="ia-drawer" aria-hidden="true" aria-label="Active IA">
      <div class="ia-drawer-inner" id="ia-drawer-inner"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="/vendor/marked/marked.umd.js"></script>
    <script src="/vendor/dompurify/purify.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
