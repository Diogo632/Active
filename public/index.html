<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Base de Conhecimento · Active Corp</title>
    <meta name="description" content="Base de conhecimento do Suporte da Active Corp com a assistente Active AI" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      // Aplica o tema salvo antes da renderização, evitando "piscar" o tema errado.
      try {
        const t = localStorage.getItem('kb-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span class="brand-text">
            <strong>Active Corp</strong>
            <small>Base de Conhecimento · Suporte</small>
          </span>
        </a>

        <nav class="nav">
          <a href="#/" data-nav="home" title="Início"><i data-icon="home"></i><span class="label">Início</span></a>
          <a href="#/docs" data-nav="docs" title="Todos os documentos"><i data-icon="library"></i><span class="label">Todos os documentos</span></a>
          <a href="#/ia" data-nav="ia" class="nav-ia" title="Active AI"><i data-icon="sparkles"></i><span class="label">Active AI</span></a>
          <a href="#/relatorio" data-nav="report" title="Relatório"><i data-icon="chart"></i><span class="label">Relatório</span><span class="nav-badge" id="nav-report-count" hidden></span></a>
        </nav>

        <div class="nav-actions">
          <a class="btn btn-primary btn-block" href="#/new" title="Escrever texto"><i data-icon="pen"></i><span class="label">Escrever texto</span></a>
          <a class="btn btn-ghost-inverse btn-block" href="#/upload" title="Enviar arquivos"><i data-icon="upload"></i><span class="label">Enviar arquivos</span></a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">
            <span class="label">Categorias</span>
            <a href="#/categories" title="Gerenciar categorias" class="icon-link"><i data-icon="settings"></i></a>
          </div>
          <div id="nav-categories" class="nav-categories"></div>
        </div>

        <div class="sidebar-footer">
          <button class="theme-toggle" id="theme-toggle" type="button" title="Alternar tema claro/escuro">
            <i data-icon="moon"></i><span>Tema</span>
          </button>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Recolher ou abrir o menu" title="Recolher/expandir o menu"><i data-icon="sidebar"></i></button>
          <button class="topbar-search" id="topbar-search" type="button" aria-label="Buscar na base (Ctrl+K)">
            <i data-icon="search"></i>
            <span>Buscar na base…</span>
            <kbd>Ctrl K</kbd>
          </button>
        </header>

        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>

    <!-- Painel lateral da Active AI, disponível em qualquer página -->
    <aside class="ia-drawer" id="ia-drawer" aria-hidden="true" aria-label="Active AI">
      <div class="ia-drawer-inner" id="ia-drawer-inner"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- Botão flutuante da Active AI (canto inferior direito) -->
    <button class="ia-fab" id="open-ia" type="button" aria-label="Perguntar à Active AI" title="Perguntar à Active AI">
      <span class="ia-fab-icon"><i data-icon="sparkles"></i></span><span class="label">Perguntar à Active AI</span>
    </button>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="/vendor/marked/marked.umd.js"></script>
    <script src="/vendor/dompurify/purify.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
